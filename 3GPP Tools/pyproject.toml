[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["F", "E9", "E722", "B", "PIE794", "RUF034"]
ignore = [
    "B008",  # PyQt idioms like parent=QModelIndex() and lambda default-arg capture
    "B905",  # zip(..., strict=...) requires Python 3.10+, project supports >= 3.8
]
